    panels: [1, 2]
    locationId: westminster-walkway
  - pages: [1, 1]
    locationId: westminster-walkway
  - pages: [2, 6]
    locationId: pocket-park
  - pages: [7, 7]
    locationId: hover-rail
  - pages: [8, 12]
    locationId: formican-base-reception
