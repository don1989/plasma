reference_sheet_prompt: |
  Colored manga character reference sheet, Spyke Tinwall. Clean linework,
  cel-shaded, vibrant colors, high-resolution, white background.
  Four full-body views: Front, 3/4 Angle, Side Profile, Back.
  EXPRESSION: cold, flat, neutral — NEVER smiling, NOT friendly.
  CHARACTER: male, age 21, slim but strong athletic build, lean muscle.
  HAIR: Ginger/copper-red, STRAIGHT and layered, length between traps and
  shoulders — does NOT touch shoulders, NOT spiky, NOT messy, NOT long.
  BANDANA: bright red bandana worn ONLY as a forehead strip — like a
  headband sitting at the hairline. It does NOT wrap around the skull,
  does NOT cover the top or back of the head. Only the forehead-width
  strip is visible, with short tails tucking into the hair at the sides.
  EYES: sharp green.
  TORSO: black fitted t-shirt under a white knee-length cloak. The cloak
  originally had sleeves — they were CRUDELY CUT OFF at the shoulder,
  leaving raw frayed edges at the shoulder holes. Arms are completely
  bare. Cloak has a black geometric pattern along the bottom hem and a
  distinct black dojo insignia on the center of the back.
  BELT: red-accented belt at waist.
  ARMS (ASYMMETRICAL — must be correct in ALL four views):
  - Character's RIGHT arm (LEFT side of image in front view): red
    fingerless glove on the hand only, stops at the wrist. Forearm and
    upper arm completely bare.
  - Character's LEFT arm (RIGHT side of image in front view): red
    metallic armored bracer/gauntlet that covers the hand and forearm
    ONLY — it ends exactly at the ELBOW JOINT and goes no further.
    The upper arm from elbow to shoulder is bare skin. The bracer does
    NOT extend above the elbow under any circumstances.
  - Only ONE arm has the bracer. The back view must also show only one
    arm with the bracer.
  LEGS: black combat pants. Dark combat boots.
  - Character's LEFT knee (RIGHT side of image): LARGE hexagonal metal
    knee pauldron — hexagonal shape, covers the entire knee cap, bigger
    than the knee itself so it clearly stands out.
  - Character's RIGHT knee (LEFT side of image): completely bare. No
    pad, no pauldron at all.
  PLASMA BLADE HILT (belt-mounted — RIGHT side — visible in ALL four views):
  - Compact cylindrical hilt, roughly forearm-length. Dark grey metallic
    body with red accent rings and grip texture.
  - Clipped directly to the RIGHT side of his red-accented belt.
  - This is a VERSATILE Plasma Blade — when activated, it projects
    energy blades of variable shape (massive broadsword-width, katana-thin,
    or anything between). Wielder controls blade shape through Plasma
    manipulation. When deactivated, only the compact hilt is visible.
  - NO sheath, NO back-mounted weapon, NO leather harness/straps.
  MASTER'S KATANA (character's LEFT hip — RIGHT side of image in front view):
  - Physical patterned katana (NOT a Plasma Blade — ancient relic, pre-
    Plasma Blade tech) in a sheath, attached horizontally to his belt on
    his LEFT hip (RIGHT side of image in front view — NOT the left side
    of the image).
  - Visible in all four views.
  CONSISTENCY — these elements must match EXACTLY across all four views:
  - Cloak dojo insignia: same shape, same position on center of the back
    panel — reproduce it identically in 3/4 and back views.
  - Bottom hem geometric pattern: same pattern, same scale, same style
    across all views.
  - Plasma Blade hilt: same compact dark grey/red hilt on RIGHT belt in
    every view — same size, same position, same accent colors.
  - Master's katana: same patterned sheath on LEFT hip in every view.
  VIEW REQUIREMENTS — each view must look genuinely different:
  - FRONT VIEW: facing directly toward viewer, full symmetrical front.
    Plasma Blade hilt visible on right belt, katana sheath on left hip.
  - 3/4 ANGLE VIEW: body turned approximately 45 degrees, showing depth
    and perspective. The face turns slightly. Both belt weapons visible.
    Clear spatial depth, NOT a flat front view.
  - SIDE PROFILE VIEW: exactly 90 degrees sideways — pure silhouette
    from the side. Completely different from the front — only one arm
    visible, side of face only. Cloak drapes cleanly without harness.
  - BACK VIEW: facing directly away from viewer. The dojo insignia is
    clearly visible on the center back of the cloak — this is now the
    dominant feature of the back view. Cloak drapes freely with no
    harness or sheath. This must look completely different from the front.

