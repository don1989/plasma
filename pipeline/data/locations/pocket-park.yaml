id: pocket-park
name: Pocket park on an elevated platform
setting: |
  A small grassy pocket park on an elevated platform between two towers in flooded
  London, 3031: a rectangle of real grass with a few young trees, one weathered
  metal bench, low planters, and a glass safety railing at the edge with sky and
  distant towers beyond. Bright daylight, open air. NOT an alley, NO graffiti,
  NO brick walls, NO dumpsters. The same park in every panel: same bench, same
  trees, same railing.
