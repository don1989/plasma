id: westminster-walkway
name: Westminster elevated walkway
setting: |
  Year 3031, flooded London. A wide elevated pedestrian walkway of grey composite
  panels and glass railings, running between colossal tower structures high above
  an ocean that covers the old city. Crowds of commuters in dark futuristic work
  clothes. Hover vehicles pass between the towers. The half-drowned clock tower of
  Big Ben and old Westminster stonework are visible below and behind. Morning
  light, pink-orange sky fading to blue.
