id: formican-base-reception
name: Formican Army Base reception
setting: |
  The interior of the Formican Army Base entrance hall, 3031: sleek, militaristic,
  metal and glass, cool blue lighting, holographic signage, stewards in Formican
  blue uniforms directing crowds of young exam candidates. High ceilings, polished
  floors, orderly queues. The same hall in every panel.
